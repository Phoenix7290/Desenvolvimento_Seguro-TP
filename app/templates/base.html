<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}eventos-api{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; color: #222; }
        header, footer { background: #f0f0f0; padding: 0.75rem 1rem; }
        footer { margin-top: 2rem; font-size: 0.85rem; color: #555; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
        th { background: #fafafa; }
    </style>
</head>
<body>
    <header>
        <h1>eventos-api — Painel interno de operações</h1>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        Uso interno — equipe de operações. eventos-api v1.
    </footer>
</body>
</html>
